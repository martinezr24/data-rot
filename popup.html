<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      width: 200px;
      padding: 15px;
      background-color: #111;
      color: #fff;
    }
    h3 {
      margin-top: 0;
      color: #ff3333;
      font-size: 16px;
      text-transform: uppercase;
      border-bottom: 1px solid #ff3333;
      padding-bottom: 5px;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    label {
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h3>Rot Settings</h3>
  
  <div class="radio-group">
    <label>
      <input type="radio" name="mode" value="cookies" checked>
      Surveillance Cookies
    </label>
    <label>
      <input type="radio" name="mode" value="blackout">
      Blackout Squares
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
